name: LP 발매정보 수집

on:
  schedule:
    # 매일 07:00 KST (= 22:00 UTC 전날). 시간 바꾸려면 아래 UTC 값 조정.
    - cron: "0 22 * * *"
  workflow_dispatch:   # 저장소 Actions 탭에서 손으로도 실행 가능

permissions:
  contents: write      # data.json 커밋/푸시 권한

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집 실행
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: python collect.py

      - name: 변경분 커밋
        run: |
          git config user.name  "lp-bot"
          git config user.email "lp-bot@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "데이터 갱신: $(date -u +%Y-%m-%d)"
            git push
          fi
